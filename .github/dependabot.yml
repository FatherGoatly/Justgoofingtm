version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    labels: [evergreen, dependencies]
    groups:
      dev-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /gm-asset-library
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    labels: [evergreen, dependencies]
    groups:
      dev-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    labels: [evergreen, dependencies]
    groups:
      actions:
        patterns: ["*"]
